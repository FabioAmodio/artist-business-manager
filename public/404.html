<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA routing redirect
      // This file handles direct navigation to routes in a single-page app
      const segmentCount = 1;
      const l = window.location;
      
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/artist-business-manager/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
          (l.search ? '?query=' + l.search.slice(1) : '') +
          l.hash,
      );
    </script>
  </head>
  <body />
</html>
