<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/dashboard" aria-label="Artist Business Manager Home">
      <span class="brand-mark"><img src="icons/logo.svg" alt="" /></span>
      <span class="brand-text">Artist Business Manager</span>
    </a>
  </header>

  <div class="shell-body">
    <aside class="sidebar" aria-label="Navigazione principale">
      <app-responsive-nav></app-responsive-nav>
    </aside>

    <main class="main-content">
      <router-outlet />
    </main>
  </div>

  <footer class="footer" aria-label="Footer applicativo">
    <div class="footer-content">
      <div class="footer-status" aria-live="polite">
        <span class="status-dot" [class.online]="appState.isOnline()"></span>
        <span class="status-text">{{ appState.isOnline() ? 'Connesso' : 'Non connesso' }}</span>
      </div>
    </div>
  </footer>
  <app-mobile-action-bar></app-mobile-action-bar>
</div>
