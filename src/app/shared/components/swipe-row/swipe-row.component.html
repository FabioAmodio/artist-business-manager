<div class="swipe-row-inner" [class.swipe-active]="swipeEnabled()">
  @if (swipeEnabled()) {
    <div class="swipe-actions swipe-actions-start" [style.width.px]="maxTotalWidth('right')" aria-hidden="true">
      @for (action of rightActions(); track action.key) {
        @if (!action.disabled) {
          <button type="button" class="swipe-action-button" [class.swipe-action-danger]="action.variant === 'danger'" [class.swipe-action-neutral]="action.variant === 'neutral'" [class.swipe-action-neutral-warning]="action.variant === 'neutral-warning'" [class.swipe-action-neutral-success]="action.variant === 'neutral-success'" [class.swipe-action-armed]="armedAction() === action" [style.width.px]="actionWidth('right', action)" [attr.aria-label]="action.label" [title]="action.label" (pointerdown)="$event.stopPropagation()" (click)="runAction(action)">
            <span class="swipe-action-icon" aria-hidden="true">{{ action.icon }}</span>
            <span class="swipe-action-label">{{ action.label }}</span>
          </button>
        }
      }
    </div>
    <div class="swipe-actions swipe-actions-end" [style.width.px]="maxTotalWidth('left')" aria-hidden="true">
      @for (action of leftActions(); track action.key) {
        @if (!action.disabled) {
          <button type="button" class="swipe-action-button" [class.swipe-action-danger]="action.variant === 'danger'" [class.swipe-action-neutral]="action.variant === 'neutral'" [class.swipe-action-neutral-warning]="action.variant === 'neutral-warning'" [class.swipe-action-neutral-success]="action.variant === 'neutral-success'" [class.swipe-action-armed]="armedAction() === action" [style.width.px]="actionWidth('left', action)" [attr.aria-label]="action.label" [title]="action.label" (pointerdown)="$event.stopPropagation()" (click)="runAction(action)">
            <span class="swipe-action-icon" aria-hidden="true">{{ action.icon }}</span>
            <span class="swipe-action-label">{{ action.label }}</span>
          </button>
        }
      }
    </div>
  }
  <div class="swipe-content" [class.swipe-snapping]="snapping()" [style.transform]="swipeEnabled() ? ('translateX(' + dragX() + 'px)') : null" (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel($event)">
    <ng-content />
  </div>
</div>
