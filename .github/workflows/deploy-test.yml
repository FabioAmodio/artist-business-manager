name: Deploy TEST cross repository

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: test-pages
  cancel-in-progress: true

jobs:
  build-test:
    if: github.repository == 'FabioAmodio/artist-business-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - run: npm ci
      - run: npm run build:test
      - uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: dist/artist-business-manager/browser

  publish-test:
    if: github.repository == 'FabioAmodio/artist-business-manager'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-build
          path: test-build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.CROSS_REPO_TOKEN }}
          external_repository: FabioAmodio/artist-business-manager-test
          publish_branch: gh-pages
          publish_dir: ./test-build
          force_orphan: true